name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: "off"
  GOFLAGS: -mod=readonly

jobs:
  test:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: [".", tui, examples/chordharp]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: "**/go.sum"

      - name: go mod tidy
        run: go mod tidy -diff

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # In the root module this includes internal/repocheck (see RELEASING.md)
      # and the Chromium phone-simulator tests, which use the runner's Chrome.
      - name: go test
        run: go test -count=1 ./...

      - name: WebView node tests
        if: matrix.module == '.'
        run: node --test render/webview/*.test.cjs
